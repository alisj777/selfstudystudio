[project]
name = "ielts-tutor"
version = "0.1.0"
description = "IELTS self-study AI tutor: knowledge graph + multi-RAG + multi-agent assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "networkx>=3.2",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "typer>=0.12",
    "snowballstemmer>=3.1.1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.70"]
openai = ["openai>=1.40"]
embeddings = [
    "sentence-transformers>=3.0",
    # torch >= 2.12 ships macOS 14+ wheels only; keep macOS 13 working.
    "torch<2.12; sys_platform == 'darwin'",
]
data = [
    "pyarrow>=26.0.1",
    "pypdf>=7.1.0",
]
ocr = [
    # 1.27+ pulls onnxruntime, which has no macOS 13 wheels
    "pymupdf>=1.24,<1.27",
]

[project.scripts]
ielts-tutor = "ielts_tutor.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ielts_tutor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Retrieval evaluation set. A result counts as relevant when its id equals an
# entry in `expected` or starts with it (so "crit.writing.CC" matches any CC band).
# Queries are written as a learner would phrase them: paraphrases, informal
# wording and some Chinese. Written before the glossary, to avoid tuning to it.


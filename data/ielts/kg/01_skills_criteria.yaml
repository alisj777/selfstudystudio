# Skills, assessment criteria and band descriptors.
#
# IMPORTANT: descriptor texts below are PARAPHRASED SUMMARIES of the public
# IELTS band descriptors, written for retrieval. Before using them for scoring,
# check each one against the official public band descriptors and add bands 0-4
# and 9. Keep `source: paraphrase` until an entry has been checked.

nodes:
  # ---------------- skills ----------------
  - id: skill.writing
    type: Skill
    name: Writing
    edges:
      ASSESSED_BY: [crit.writing.TA, crit.writing.TR, crit.writing.CC, crit.writing.LR, crit.writing.GRA]
      HAS_QUESTION_TYPE: [qt.writing.t1.line_graph, qt.writing.t1.bar_chart, qt.writing.t1.pie_chart, qt.writing.t1.table,
                          qt.writing.t1.process, qt.writing.t1.map, qt.writing.t1.mixed,
                          qt.writing.t2.opinion, qt.writing.t2.discussion, qt.writing.t2.adv_disadv,
                          qt.writing.t2.problem_solution, qt.writing.t2.two_part]
  - id: skill.speaking
    type: Skill
    name: Speaking
    edges:
      ASSESSED_BY: [crit.speaking.FC, crit.speaking.LR, crit.speaking.GRA, crit.speaking.P]
      HAS_QUESTION_TYPE: [qt.speaking.part1, qt.speaking.part2, qt.speaking.part3]
  - id: skill.reading
    type: Skill
    name: Reading
    edges:
      HAS_QUESTION_TYPE: [qt.reading.tfng, qt.reading.ynng, qt.reading.matching_headings, qt.reading.matching_information,
                          qt.reading.matching_features, qt.reading.matching_endings, qt.reading.mcq,
                          qt.reading.sentence_completion, qt.reading.summary_completion, qt.reading.diagram_label,
                          qt.reading.short_answer]
  - id: skill.listening
    type: Skill
    name: Listening
    edges:
      HAS_QUESTION_TYPE: [qt.listening.form_completion, qt.listening.note_completion, qt.listening.table_completion,
                          qt.listening.mcq, qt.listening.map_labelling, qt.listening.diagram_labelling,
                          qt.listening.matching, qt.listening.sentence_completion, qt.listening.short_answer]

  # ---------------- writing criteria ----------------
  - id: crit.writing.TA
    type: Criterion
    name: Task Achievement
    short: TA
    skill: writing
    applies_to: task1
    descriptors:
      8:
        descriptor: Covers all requirements of the task sufficiently; presents, highlights and illustrates key features clearly and appropriately.
        key_features: [all requirements covered, key features clearly highlighted, appropriate illustration with data]
        source: paraphrase
      7:
        descriptor: Covers the requirements of the task; presents a clear overview of main trends, differences or stages; clearly presents and highlights key features, though they could be more fully extended.
        key_features: [clear overview, main trends or stages identified, key features highlighted]
        source: paraphrase
      6:
        descriptor: Addresses the requirements of the task with an overview and appropriately selected information; presents and adequately highlights key features, but some details may be irrelevant, inappropriate or inaccurate.
        key_features: [overview present, key features adequately highlighted, some irrelevant or inaccurate detail]
        source: paraphrase
      5:
        descriptor: Generally addresses the task; recounts detail mechanically with no clear overview; key features are inadequately covered and there may be a focus on details or no data to support the description.
        key_features: [no clear overview, mechanical listing of detail, key features inadequately covered]
        source: paraphrase

  - id: crit.writing.TR
    type: Criterion
    name: Task Response
    short: TR
    skill: writing
    applies_to: task2
    descriptors:
      8:
        descriptor: Sufficiently addresses all parts of the task; presents a well-developed response with relevant, extended and supported ideas.
        key_features: [all parts addressed, well-developed response, ideas extended and supported]
        source: paraphrase
      7:
        descriptor: Addresses all parts of the task; presents a clear position throughout; main ideas are extended and supported but there may be a tendency to over-generalise or a lack of focus.
        key_features: [clear position throughout, main ideas extended and supported, occasional over-generalisation]
        source: paraphrase
      6:
        descriptor: Addresses all parts of the task, though some more fully than others; presents a relevant position although conclusions may be unclear or repetitive; main ideas are relevant but some are inadequately developed or unclear.
        key_features: [uneven coverage of task parts, relevant but sometimes unclear position, some ideas underdeveloped]
        source: paraphrase
      5:
        descriptor: Addresses the task only partially; expresses a position but its development is not always clear and there may be no conclusions; main ideas are limited, insufficiently developed, and there may be irrelevant detail.
        key_features: [partial response to task, unclear development of position, limited or irrelevant ideas]
        source: paraphrase

  - id: crit.writing.CC
    type: Criterion
    name: Coherence and Cohesion
    short: CC
    skill: writing
    descriptors:
      8:
        descriptor: Sequences information and ideas logically; manages all aspects of cohesion well; uses paragraphing sufficiently and appropriately.
        key_features: [logical sequencing, cohesion well managed, appropriate paragraphing]
        source: paraphrase
      7:
        descriptor: Logically organises information and ideas with clear progression throughout; uses a range of cohesive devices appropriately, with some under- or over-use; presents a clear central topic within each paragraph.
        key_features: [clear progression, range of cohesive devices, clear central topic per paragraph]
        source: paraphrase
      6:
        descriptor: Arranges information and ideas coherently with clear overall progression; uses cohesive devices effectively but cohesion within or between sentences may be faulty or mechanical; referencing may not always be clear; paragraphing may not always be logical.
        key_features: [coherent arrangement, mechanical or faulty linking, unclear referencing at times]
        source: paraphrase
      5:
        descriptor: Presents information with some organisation but may lack overall progression; makes inadequate, inaccurate or over-use of cohesive devices; may be repetitive because of lack of referencing and substitution; paragraphing may be inadequate.
        key_features: [weak overall progression, over-used or inaccurate linkers, repetition from lack of referencing]
        source: paraphrase

  - id: crit.writing.LR
    type: Criterion
    name: Lexical Resource
    short: LR
    skill: writing
    descriptors:
      8:
        descriptor: Uses a wide range of vocabulary fluently and flexibly to convey precise meanings; skilfully uses uncommon lexical items with occasional inaccuracies in word choice and collocation; produces rare errors in spelling and word formation.
        key_features: [wide and precise vocabulary, skilful uncommon items, rare spelling or word-formation errors]
        source: paraphrase
      7:
        descriptor: Uses a sufficient range of vocabulary to allow some flexibility and precision; uses less common items with some awareness of style and collocation; may produce occasional errors in word choice, spelling and word formation.
        key_features: [flexible and fairly precise vocabulary, less common items with collocation awareness, occasional errors]
        source: paraphrase
      6:
        descriptor: Uses an adequate range of vocabulary for the task; attempts less common vocabulary with some inaccuracy; makes some errors in spelling and word formation that do not impede communication.
        key_features: [adequate range, inaccurate attempts at less common words, errors that do not impede meaning]
        source: paraphrase
      5:
        descriptor: Uses a limited range of vocabulary that is minimally adequate for the task; may make noticeable errors in spelling and word formation that cause some difficulty for the reader.
        key_features: [limited range, noticeable spelling and word-formation errors, some strain on reader]
        source: paraphrase

  - id: crit.writing.GRA
    type: Criterion
    name: Grammatical Range and Accuracy
    short: GRA
    skill: writing
    descriptors:
      8:
        descriptor: Uses a wide range of structures; the majority of sentences are error-free; makes only very occasional errors or inappropriacies.
        key_features: [wide range of structures, majority error-free, very occasional errors]
        source: paraphrase
      7:
        descriptor: Uses a variety of complex structures; produces frequent error-free sentences; has good control of grammar and punctuation but may make a few errors.
        key_features: [variety of complex structures, frequent error-free sentences, a few errors]
        source: paraphrase
      6:
        descriptor: Uses a mix of simple and complex sentence forms; makes some errors in grammar and punctuation but they rarely reduce communication.
        key_features: [mix of simple and complex forms, some errors, communication rarely reduced]
        source: paraphrase
      5:
        descriptor: Uses only a limited range of structures; attempts complex sentences but these tend to be less accurate than simple sentences; may make frequent grammatical errors and punctuation may be faulty, causing some difficulty for the reader.
        key_features: [limited range, complex sentences inaccurate, frequent errors]
        source: paraphrase

  # ---------------- speaking criteria ----------------
  - id: crit.speaking.FC
    type: Criterion
    name: Fluency and Coherence
    short: FC
    skill: speaking
    descriptors:
      8:
        descriptor: Speaks fluently with only occasional repetition or self-correction; hesitation is usually content-related and only rarely to search for language; develops topics coherently and appropriately.
        key_features: [fluent, hesitation mostly content-related, coherent topic development]
        source: paraphrase
      7:
        descriptor: Speaks at length without noticeable effort or loss of coherence; may show language-related hesitation at times, or some repetition and self-correction; uses a range of connectives and discourse markers with some flexibility.
        key_features: [speaks at length easily, some language-related hesitation, flexible discourse markers]
        source: paraphrase
      6:
        descriptor: Is willing to speak at length, though may lose coherence at times due to occasional repetition, self-correction or hesitation; uses a range of connectives and discourse markers but not always appropriately.
        key_features: [willing to speak at length, occasional loss of coherence, connectives not always appropriate]
        source: paraphrase
      5:
        descriptor: Usually maintains flow of speech but uses repetition, self-correction and/or slow speech to keep going; may over-use certain connectives; simple speech is fluent but more complex communication causes fluency problems.
        key_features: [relies on repetition or slow speech, over-used connectives, fluency drops on complex ideas]
        source: paraphrase

  - id: crit.speaking.LR
    type: Criterion
    name: Lexical Resource
    short: LR
    skill: speaking
    descriptors:
      8:
        descriptor: Uses a wide vocabulary resource readily and flexibly to convey precise meaning; uses less common and idiomatic vocabulary skilfully, with occasional inaccuracies; paraphrases effectively as required.
        key_features: [wide and precise vocabulary, skilful idiomatic language, effective paraphrase]
        source: paraphrase
      7:
        descriptor: Uses vocabulary resource flexibly to discuss a variety of topics; uses some less common and idiomatic vocabulary and shows some awareness of style and collocation, with some inappropriate choices; uses paraphrase effectively.
        key_features: [flexible across topics, some idiomatic language, effective paraphrase]
        source: paraphrase
      6:
        descriptor: Has a wide enough vocabulary to discuss topics at length and make meaning clear in spite of inappropriacies; generally paraphrases successfully.
        key_features: [enough vocabulary to speak at length, some inappropriacies, generally successful paraphrase]
        source: paraphrase
      5:
        descriptor: Manages to talk about familiar and unfamiliar topics but uses vocabulary with limited flexibility; attempts to use paraphrase but with mixed success.
        key_features: [limited flexibility, mixed success with paraphrase]
        source: paraphrase

  - id: crit.speaking.GRA
    type: Criterion
    name: Grammatical Range and Accuracy
    short: GRA
    skill: speaking
    descriptors:
      8:
        descriptor: Uses a wide range of structures flexibly; produces a majority of error-free sentences with only very occasional inappropriacies or basic, non-systematic errors.
        key_features: [wide flexible range, majority error-free, non-systematic errors only]
        source: paraphrase
      7:
        descriptor: Uses a range of complex structures with some flexibility; frequently produces error-free sentences, though some grammatical mistakes persist.
        key_features: [range of complex structures, frequent error-free sentences, persistent minor mistakes]
        source: paraphrase
      6:
        descriptor: Uses a mix of simple and complex structures, but with limited flexibility; may make frequent mistakes with complex structures, though these rarely cause comprehension problems.
        key_features: [mix of simple and complex, limited flexibility, errors in complex structures]
        source: paraphrase
      5:
        descriptor: Produces basic sentence forms with reasonable accuracy; uses a limited range of more complex structures, but these usually contain errors and may cause some comprehension problems.
        key_features: [basic forms accurate, complex structures usually contain errors]
        source: paraphrase

  - id: crit.speaking.P
    type: Criterion
    name: Pronunciation
    short: P
    skill: speaking
    descriptors:
      8:
        descriptor: Uses a wide range of pronunciation features; sustains flexible use of features with only occasional lapses; is easy to understand throughout; L1 accent has minimal effect on intelligibility.
        key_features: [wide range of features, flexible intonation and stress, easy to understand throughout]
        source: paraphrase
      7:
        descriptor: Shows all the positive features of Band 6 and some, but not all, of the positive features of Band 8.
        key_features: [between band 6 and band 8 features]
        source: paraphrase
      6:
        descriptor: Uses a range of pronunciation features with mixed control; shows some effective use of features but this is not sustained; can generally be understood throughout, though mispronunciation of individual words or sounds reduces clarity at times.
        key_features: [range of features with mixed control, generally understood, some words or sounds unclear]
        source: paraphrase
      5:
        descriptor: Shows all the positive features of Band 4 and some, but not all, of the positive features of Band 6.
        key_features: [between band 4 and band 6 features]
        source: paraphrase

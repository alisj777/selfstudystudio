    name: Education
    skills: [writing, speaking]
    keywords: [school, university, students, teachers, curriculum, learning]
    collocations: [academic performance, compulsory education, tuition fees, lifelong learning]
    edges: {RELATED_TO: [topic.technology, topic.work]}
  - id: topic.education.online
    name: Online and distance learning
    parent: topic.education
    skills: [writing, speaking]
    keywords: [online courses, e-learning, remote study, digital classroom]
